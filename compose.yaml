services:
  postgres:
    image: postgres:17
    container_name: nexus-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nexus_one
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_one"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
